spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.respvporaicxobsfbadx
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#no. of connection pool allowed
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#server
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

#jwt token
jwt.secret=lms-secret-key-for-jwt-token-generation-2024-library-management-system
#${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ===== CORS (only needed when the frontend is served from another origin) =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.security.enforce-roles=${ENFORCE_ROLES:false}
app.security.password-hash-endpoint-enabled=${PASSWORD_HASH_ENDPOINT_ENABLED:true}

app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.librarian-password=${SEED_LIBRARIAN_PASSWORD:lib123}

#ollama
ollama.base-url=http://localhost:11434
ollama.model=gemma3:1b

