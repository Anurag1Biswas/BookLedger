# Used by all Spring Boot tests (@ActiveProfiles("test")): in-memory H2, no Flyway, no Kafka broker.
spring.datasource.url=jdbc:h2:mem:lmstest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
jwt.secret=test-secret-test-secret-test-secret-test-secret-123456
jwt.expiration=3600000
app.kafka.enabled=false
app.security.enforce-roles=false
app.security.password-hash-endpoint-enabled=true
