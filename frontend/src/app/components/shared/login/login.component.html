<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-icon" aria-hidden="true">📚</div>
      <h1>BookLedger</h1>
      <p>Sign in to manage your library</p>
    </div>

    <div class="alert alert-warn" role="status" *ngIf="sessionExpired" style="margin-bottom:16px">
      Your session has expired. Please sign in again.
    </div>
    <div class="alert alert-error" role="alert" *ngIf="error" id="login-error" style="margin-bottom:16px">{{ error }}</div>

    <form (ngSubmit)="login()" novalidate>
      <div class="form-group">
        <label class="label required" for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus
               [(ngModel)]="username" [class.invalid]="!!error"
               [attr.aria-describedby]="error ? 'login-error' : null">
      </div>
      <div class="form-group">
        <label class="label required" for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" [type]="showPassword ? 'text' : 'password'"
                 autocomplete="current-password" [(ngModel)]="password" [class.invalid]="!!error"
                 [attr.aria-describedby]="error ? 'login-error' : null">
          <button type="button" class="password-visibility-toggle" (click)="showPassword = !showPassword"
                  [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                  [attr.aria-pressed]="showPassword" title="{{ showPassword ? 'Hide password' : 'Show password' }}">
            <span aria-hidden="true">{{ showPassword ? '🙈' : '👁️' }}</span>
          </button>
        </div>
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <span class="spinner spinner-sm" *ngIf="loading" aria-hidden="true"></span>
          {{ loading ? 'Signing in…' : 'Sign in' }}
        </button>
      </div>
    </form>
  </div>
</div>
